<!DOCTYPE html>

<head>
    <title>Map editor</title>
    <style>
        body {
            background-color: azure;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            text-align: center;
        }

        .container {
            display: flex;
            align-items: flex-start;
        }

        .container_vertical {
            display: block;
        }

        #editor {
            border: 1px solid black;
            background-color: #eee;
        }

        #message {
            margin-left: 8px;
            margin-right: 8px;
            width: 120px;
            height: 120px;
            font-size: 30px;
            border: 1px solid black;
            background-color: #eee;
        }

        button {
            display: block;
            border: 1px solid black;
            border-radius: 4px;
            font-size: 30px;
            cursor: pointer;
            margin: 8px;
            padding: 8px;
            background-color: aquamarine;
        }
    </style>
</head>

<body>
    <h1>Level editor for Throne Wars</h1>
    <div class="container">
        <canvas id="editor"></canvas>
        <div class="container_verical">
            <div id="message">---</div>
            <button id="send_btn">Send</button>
            <button id="pop_btn">Pop</button>
            <button id="hmirror_btn">H-Mirror</button>
            <button id="vmirror_btn">V-Mirror</button>
        </div>
        <textarea id="textarea"></textarea>
    </div>

    <script src="editor.js"></script>
</body>

</html>
